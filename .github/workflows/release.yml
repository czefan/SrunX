name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37.1 build-tools;37.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for var in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing required repository secret: $var"
              exit 1
            fi
          done

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 --decode > "${{ runner.temp }}/srunx-release.jks"
          chmod 600 "${{ runner.temp }}/srunx-release.jks"

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build signed Release APK
        env:
          SRUNX_KEYSTORE_FILE: ${{ runner.temp }}/srunx-release.jks
          SRUNX_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SRUNX_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SRUNX_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Verify signature and prepare release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify "$APK_PATH"
          mkdir -p dist
          [[ "$RELEASE_TAG" =~ ^v[0-9]+([.][0-9]+)*([-+][0-9A-Za-z.-]+)?$ ]] || exit 1
          OUT_NAME="SrunX-$RELEASE_TAG.apk"
          cp "$APK_PATH" "dist/${OUT_NAME}"
          (cd dist && sha256sum "${OUT_NAME}" > "${OUT_NAME}.sha256")

      - name: Clean up temporary keystore
        if: always()
        run: rm -f "${{ runner.temp }}/srunx-release.jks"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/SrunX-${{ github.ref_name }}.apk
            dist/SrunX-${{ github.ref_name }}.apk.sha256
